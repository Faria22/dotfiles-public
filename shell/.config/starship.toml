add_newline = false

# Left prompt
format = '$hostname${custom.worktrunk}$git_branch$git_status$character'

[directory]
style = 'blue'
format = '[$path]($style) '
read_only = ' 󰌾'

[custom.worktrunk]
command = "starship-worktrunk"
when = true
format = "$output "
description = "Compacts Worktrunk branch suffixes in repo directory names"

[hostname]
format = '[$hostname]($style):'
style = 'bold green'
aliases = { 'argenti-linux-server' = 'majorana' }
ssh_symbol = ' '

[git_branch]
symbol = ' '
style = 'purple'
format = '[$branch]($style) '

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'yellow'

